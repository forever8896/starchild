[package]
name = "starchild_core"
version = "0.2.0"
description = "Shared, platform-agnostic engine for Starchild (native + WASM)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The shared core: NO tauri, NO rusqlite, NO tokio, NO reqwest.
# Pure logic + types only, so it can compile to native AND wasm32.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
log = "0.4"
hex = "0.4.3"
sha2 = "0.10.9"
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"

# WASM randomness: getrandom needs the `js` backend in the browser.
# Native targets pull getrandom transitively through `rand` without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1.0"
